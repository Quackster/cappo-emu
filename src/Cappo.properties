# cappo-emu runtime configuration
# Loaded from the classpath root by cappo.engine.Server (getResourceAsStream).
# NOTE: contains DB credentials for this local machine -> gitignored.

# --- MySQL ---
mysql.host=127.0.0.1
mysql.port=3306
mysql.db=cappo
mysql.user=root
mysql.pass=verysecret
# mysql.block=true makes every Database.exec a no-op (read-only/test mode)
mysql.block=false

# --- Game server ---
# port.game is MANDATORY (no default; Integer.parseInt NPEs without it)
port.game=30001
game.type=1
game.give.credits=0
game.give.ducks=0
game.tickets.block=false

# --- Fastfood / SnowStorm game server ---
ff.ip=ff.lavvos.pl
ff.port=30002
ff.block=false

# --- SSO ---
sso.secretkey=log#in#key

# --- Logging ---
log.infile=false